<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SAR Brain · RetroDMTA</title>
<script src="../renin_slideria_brain_20261116/plotly-2.35.2.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;color:#1e293b;background:white}header,nav{background:white;color:#203249;padding:10px 18px}header{font-size:15px;font-weight:700}#summary{font-size:12px;color:#53677b;font-weight:400;margin-left:14px}nav{display:flex;gap:16px;align-items:center}nav a{color:white;font-weight:600}nav a[aria-current]{text-decoration:none;color:#a9caff}.back{margin-left:auto}form{display:flex;flex-wrap:wrap;align-items:end;gap:10px;padding:9px 16px;border-bottom:1px solid #d9dfe7}label{display:grid;gap:3px;color:#48566b;font-size:11px;font-weight:600}input,select,button{font:12px system-ui;border:1px solid #c6ced8;border-radius:4px;background:white;padding:5px;color:#17253b}button{background:#2563eb;color:white;font-weight:600;cursor:pointer}#chart{height:calc(100dvh - 115px);min-height:390px}aside{position:fixed;right:13px;bottom:13px;padding:8px 12px;border:1px solid #d5dde7;border-radius:6px;background:#fffffff5;font-size:11px;pointer-events:none}.card{position:fixed;z-index:4;background:white;border:1px solid #cbd5df;box-shadow:0 4px 20px #10203025;border-radius:6px;padding:9px;width:218px;pointer-events:none}.card svg{display:block;width:200px;height:112px}.card p{margin:0}@media(max-width:650px){header span{display:block}#summary{margin:3px 0 0}#chart{height:65dvh}aside{position:static}}
</style></head><body><header>SAR Brain · RetroDMTA · <span id="target"></span><span id="summary"></span></header>
<form onsubmit="return false"><label>Campaign<select id="campaign"><option>RENIN</option><option>FXA</option><option>PPARD</option><option>MMP8</option></select></label><label>Y-axis<select id="metric"></select></label><label>Series<select id="series"></select></label><label>Min descendants<input id="minimum" type="number" min="0" value="0" style="width:68px"></label><label>Color by<select id="color"><option>Y-axis metric</option><option>Descendant count</option></select></label><label>Size by<select id="size"><option>Descendants</option><option>Uniform</option><option>Y-axis metric</option></select></label><label>Opacity by<select id="opacity"><option>Uniform</option><option>Y-axis metric</option></select></label><label>Show edges<select id="edges"><option>All</option><option>Critical path (≥5 descendants)</option><option>None</option></select></label><label>Highlight lineage of<input id="lineage" placeholder="Compound ID" style="width:114px"></label><button type="button" id="best">Show best-compound lineage</button><a class="back" href="../index.html">SAR Brain home</a></form><main id="chart"></main><aside id="legend"></aside><div id="card" class="card" hidden></div>
<script>
const $=id=>document.getElementById(id),chart=$('chart'),card=$('card'),store=new Map(),pending=new Set();let active,data,pinned=false;
function palette(v){return v>=8?'#16a34a':v>=7?'#eab308':v>=6?'#f59e0b':'#dc2626'}
function options(el,values){el.replaceChildren(...values.map(v=>new Option(v,v)))}
function draw(){
 if(!data)return;card.hidden=true;pinned=false;
 const ns=data.nodes,desc=data.desc;const key=$('lineage').value.trim().toUpperCase(),seed=ns.findIndex(n=>n.id===key),line=new Set();
 if(seed>=0){for(let i=seed;i!==null;i=ns[i].parent)line.add(i);const stack=[seed];while(stack.length){for(const i of data.children[stack.pop()]){stack.push(i);line.add(i)}}}
 const ids=ns.map((_,i)=>i).filter(i=>($('series').value==='All'||ns[i].family===$('series').value)&&desc[i]>=Number($('minimum').value));
 const visible=new Set(ids),groups=[{x:[],y:[]},{x:[],y:[]}];for(const i of ids){let j=ns[i].parent;if(j===null||!visible.has(j)||$('edges').selectedIndex===2||($('edges').selectedIndex===1&&desc[i]<5))continue;
 const g=groups[Number(line.has(i)&&line.has(j))];g.x.push(ns[j].date,ns[i].date,null);g.y.push(ns[j].y,ns[i].y,null)}
 const traces=groups.map((g,i)=>({...g,type:'scatter',mode:'lines',line:{color:i?'#7548cf':'#cdd7e2',width:i?2:1},hoverinfo:'skip'}));
 const vals=ns.map(n=>n.y),lo=Math.min(...vals),range=Math.max(...vals)-lo||1,scaled=i=>(ns[i].y-lo)/range;
 const descendantColor=i=>desc[i]>=50?'#7435b1':desc[i]>=10?'#456bbc':desc[i]>0?'#64a9ba':'#adb8c5';
 traces.push({type:'scatter',mode:'markers',x:ids.map(i=>ns[i].date),y:ids.map(i=>ns[i].y),customdata:ids,hoverinfo:'none',marker:{color:ids.map(i=>$('color').selectedIndex?descendantColor(i):palette(ns[i].y)),size:ids.map(i=>[Math.min(28,6+2.5*Math.sqrt(desc[i])),7,6+17*scaled(i)][$('size').selectedIndex]),symbol:ids.map(i=>ns[i].parent===null?'diamond':'circle'),opacity:ids.map(i=>(seed>=0&&!line.has(i)?.12:1)*($('opacity').selectedIndex?.28+.72*scaled(i):1)),line:{width:ids.map(i=>line.has(i)?2:.6),color:ids.map(i=>line.has(i)?'#4922a0':'#667588')}}});
 $('legend').textContent=($('color').selectedIndex?'Descendants · darker = more':'Activity · green ≥8 · yellow 7–8 · orange 6–7 · red <6')+'   ◆ Root   ─ Inferred link';
 Plotly.react(chart,traces,{margin:{l:65,r:25,t:20,b:62},showlegend:false,hovermode:'closest',xaxis:{type:'date',title:'Recorded experimental date',gridcolor:'#edf0f4'},yaxis:{title:active+' '+data.metric,gridcolor:'#edf0f4'}},{responsive:true,displaylogo:false}).then(()=>{
 for(const name of ['plotly_click','plotly_hover','plotly_unhover'])chart.removeAllListeners(name);
 function inspect(e){const p=e.points.find(x=>Number.isInteger(x.customdata));if(!p)return;const i=p.customdata,n=ns[i];card.innerHTML=n.svg;const t=document.createElement('p');t.textContent=n.id+' · '+n.family+' · '+n.date+' · '+data.metric+' '+n.y.toFixed(2)+' · '+desc[i]+' descendants'+(n.parent===null?' · Root':' · Earlier analog '+ns[n.parent].id+' ('+n.sim.toFixed(2)+')');card.append(t);card.hidden=false;card.style.left=Math.max(4,Math.min(innerWidth-224,(e.event?.clientX||0)+14))+'px';card.style.top=Math.max(4,Math.min(innerHeight-card.offsetHeight-5,(e.event?.clientY||0)+16))+'px'}
 chart.on('plotly_hover',e=>{if(!pinned)inspect(e)});chart.on('plotly_unhover',()=>{if(!pinned)card.hidden=true});chart.on('plotly_click',e=>{inspect(e);pinned=true})
 })}
function show(){data=store.get(active);if(!data)return;const ns=data.nodes;options($('series'),['All',...new Set(ns.map(n=>n.family).sort())]);options($('metric'),[active+' '+data.metric+' ('+ns.length+')']);$('lineage').value='';$('summary').textContent=ns.length.toLocaleString()+' compounds · Nearest earlier analog in the same series (Morgan Tanimoto ≥ 0.60).';draw()}
window.loadCampaign=async(name,payload)=>{const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));const d=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();d.desc=d.nodes.map(()=>0);d.children=d.nodes.map(()=>[]);for(let i=d.nodes.length-1;i>=0;i--){let j=d.nodes[i].parent;if(j!==null){d.desc[j]+=1+d.desc[i];d.children[j].push(i)}}store.set(name,d);if(active===name)show()};
function load(){const h=location.hash.slice(1);active=['RENIN','FXA','MMP8','PPARD'].includes(h)?h:'RENIN';$('target').textContent=active;$('campaign').value=active;if(store.has(active))return show();data=null;card.hidden=true;$('summary').textContent='Loading…';if(chart.data)Plotly.purge(chart);if(!pending.has(active)){pending.add(active);const s=document.createElement('script');s.src=active+'.js';document.body.append(s)}}
$('campaign').onchange=()=>{location.hash=$('campaign').value};document.querySelector('form').addEventListener('input',e=>{if(e.target!==$('campaign'))draw()});$('best').onclick=()=>{if(data){$('lineage').value=data.nodes.reduce((a,b)=>a.y>=b.y?a:b).id;draw()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=false;card.hidden=true}});window.addEventListener('hashchange',load);load()
</script></body></html>
