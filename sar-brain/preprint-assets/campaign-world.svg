<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 988" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">The medicinal chemistry world</title><desc id="desc">Campaign sources initialize the environment. A player prepares an intermediate, makes and assays a compound, or buys a prediction. Evidence, stock and cost update until the winner is assayed.</desc><defs><marker id="ink" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#19313d"/></marker><marker id="teal" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#006962"/></marker><marker id="purple" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#674397"/></marker><marker id="muted" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#4c626d"/></marker><marker id="blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#285487"/></marker><marker id="line" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#718691"/></marker><marker id="white" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#fff"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="32" fill="#006962" font-size="16" font-weight="700">CAMPAIGN INPUTS</text><rect x="35" y="48" width="313" height="118" rx="8" fill="#f5f8f9" stroke="#b4c3c9"/><text x="51" y="79" fill="#19313d" font-size="22" font-weight="680">Patent chemistry</text><text x="51" y="108" fill="#19313d" font-size="17" font-weight="400">Compounds and structures</text><text x="51" y="131" fill="#19313d" font-size="17" font-weight="400">Reaction inputs, products and</text><text x="51" y="154" fill="#19313d" font-size="17" font-weight="400">shared intermediates</text><rect x="370" y="48" width="313" height="118" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="386" y="79" fill="#006962" font-size="22" font-weight="680">Experimental record</text><text x="386" y="108" fill="#19313d" font-size="17" font-weight="400">Assay values by compound</text><text x="386" y="131" fill="#19313d" font-size="17" font-weight="400">Experimental dates when available</text><rect x="705" y="48" width="321" height="118" rx="8" fill="#f5f0fa" stroke="#bbabd3"/><text x="721" y="79" fill="#674397" font-size="22" font-weight="680">Computed relationships</text><text x="721" y="108" fill="#19313d" font-size="17" font-weight="400">Fingerprint similarities</text><text x="721" y="131" fill="#19313d" font-size="17" font-weight="400">Candidate FEP pairs and</text><text x="721" y="154" fill="#19313d" font-size="17" font-weight="400">their LoMap scores</text><path d="M191 166 V188 H847" fill="none" stroke="#718691" stroke-width="2" /><path d="M526 166 V211" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><path d="M866 166 V188 H847" fill="none" stroke="#718691" stroke-width="2" /><rect x="186" y="213" width="680" height="91" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="202" y="244" fill="#006962" font-size="22" font-weight="680">Opening inventory</text><text x="202" y="273" fill="#19313d" font-size="17" font-weight="400">Supply the starting materials, references and their measured activities.</text><path d="M526 304 V344" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><text x="35" y="355" fill="#006962" font-size="16" font-weight="700">AT EACH DECISION</text><rect x="35" y="370" width="634" height="115" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="51" y="401" fill="#006962" font-size="22" font-weight="680">What the player sees</text><text x="51" y="430" fill="#19313d" font-size="17" font-weight="400">Structures, routes, measured activities and purchased predictions.</text><text x="51" y="453" fill="#19313d" font-size="17" font-weight="400">Current stock determines the remaining price of every candidate.</text><text x="51" y="476" fill="#19313d" font-size="17" font-weight="400">The ledger tracks synthesis operations and FEP queries.</text><rect x="700" y="370" width="326" height="115" rx="8" fill="#f5f8f9" stroke="#b4c3c9"/><text x="716" y="401" fill="#19313d" font-size="22" font-weight="680">What the simulator holds</text><text x="716" y="430" fill="#19313d" font-size="17" font-weight="400">Unrevealed assay outcomes</text><text x="716" y="453" fill="#19313d" font-size="17" font-weight="400">and simulated FEP errors.</text><path d="M526 344 V370" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><path d="M350 485 V518" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><rect x="35" y="520" width="635" height="84" rx="8" fill="#eff5fb" stroke="#acc3db"/><text x="51" y="551" fill="#285487" font-size="22" font-weight="680">Choose a move</text><text x="51" y="580" fill="#19313d" font-size="17" font-weight="400">A human chooses on the board, or a policy ranks the candidates.</text><path d="M351 604 V625 H855" fill="none" stroke="#718691" stroke-width="2" /><path d="M351 625 H192 V649" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><path d="M527 625 V649" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><path d="M855 625 V649" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><path d="M864 485 H1038 V634 H866 V649" fill="none" stroke="#4c626d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#muted)"/><rect x="35" y="651" width="313" height="154" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="51" y="682" fill="#006962" font-size="22" font-weight="680">Prepare an intermediate</text><text x="51" y="711" fill="#19313d" font-size="17" font-weight="400">Pay for missing operations.</text><text x="51" y="734" fill="#19313d" font-size="17" font-weight="400">Retain their products in stock.</text><text x="51" y="757" fill="#19313d" font-size="17" font-weight="400">Reprice every route sharing</text><text x="51" y="780" fill="#19313d" font-size="17" font-weight="400">the newly stocked material.</text><rect x="370" y="651" width="313" height="154" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="386" y="682" fill="#006962" font-size="22" font-weight="680">Make and assay</text><text x="386" y="711" fill="#19313d" font-size="17" font-weight="400">Pay for missing operations.</text><text x="386" y="734" fill="#19313d" font-size="17" font-weight="400">Retain their products, reveal</text><text x="386" y="757" fill="#19313d" font-size="17" font-weight="400">the assay and add a measured</text><text x="386" y="780" fill="#19313d" font-size="17" font-weight="400">reference for later predictions.</text><rect x="705" y="651" width="321" height="154" rx="8" fill="#f5f0fa" stroke="#bbabd3"/><text x="721" y="682" fill="#674397" font-size="22" font-weight="680">Query FEP</text><text x="721" y="711" fill="#19313d" font-size="17" font-weight="400">Use an eligible measured</text><text x="721" y="734" fill="#19313d" font-size="17" font-weight="400">reference. Pay $1 and reveal</text><text x="721" y="757" fill="#19313d" font-size="17" font-weight="400">a simulated prediction.</text><text x="721" y="780" fill="#19313d" font-size="17" font-weight="400">Inventory stays as it was.</text><path d="M191 805 V827 H866 V805" fill="none" stroke="#718691" stroke-width="2" /><path d="M526 805 V851" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><rect x="200" y="853" width="653" height="85" rx="8" fill="#eff5fb" stroke="#acc3db"/><text x="216" y="884" fill="#285487" font-size="22" font-weight="680">Update evidence, inventory and spend</text><text x="216" y="913" fill="#19313d" font-size="17" font-weight="400">Winning compound assayed? Finish and compare costs. Otherwise choose again.</text><path d="M200 895 H15 V426 H34" fill="none" stroke="#285487" stroke-width="2" marker-end="url(#blue)"/><path d="M864 634 H648 V649" fill="none" stroke="#4c626d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#muted)"/><text x="36" y="968" fill="#4c626d" font-size="16" font-weight="400">Route prices count each still-missing operation once. The assay is included when making a compound.</text></svg>