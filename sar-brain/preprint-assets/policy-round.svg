<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 602" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">How the replay selects experiments</title><desc id="desc">SAR and optional FEP scores determine a batch. Cost-aware policies price compounds from current stock. Assaying and retaining stock changes the next round.</desc><defs><marker id="ink" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#19313d"/></marker><marker id="teal" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#006962"/></marker><marker id="purple" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#674397"/></marker><marker id="muted" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#4c626d"/></marker><marker id="blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#285487"/></marker><marker id="line" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#718691"/></marker><marker id="white" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#fff"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="34" y="32" fill="#006962" font-size="16" font-weight="700">ONE ROUND OF THE FORWARD STRATEGIES</text><rect x="34" y="47" width="475" height="115" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="50" y="78" fill="#006962" font-size="22" font-weight="680">SAR estimate</text><text x="50" y="107" fill="#19313d" font-size="17" font-weight="400">Up to five measured fingerprint neighbors.</text><text x="50" y="130" fill="#19313d" font-size="17" font-weight="400">Weight each neighbor by similarity to the fourth power.</text><text x="50" y="153" fill="#19313d" font-size="17" font-weight="400">Novelty = 1 − similarity to the closest measured neighbor.</text><rect x="535" y="47" width="478" height="115" rx="8" fill="#f5f0fa" stroke="#bbabd3"/><text x="551" y="78" fill="#674397" font-size="22" font-weight="680">FEP estimate, when enabled</text><text x="551" y="107" fill="#19313d" font-size="17" font-weight="400">Screen newly eligible unmade compounds.</text><text x="551" y="130" fill="#19313d" font-size="17" font-weight="400">Use a measured reference with LoMap ≥ cutoff.</text><text x="551" y="153" fill="#19313d" font-size="17" font-weight="400">Store each simulated prediction and charge $1.</text><path d="M270 162 V182 H773 V162" fill="none" stroke="#718691" stroke-width="2" /><path d="M520 182 V206" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><rect x="99" y="209" width="844" height="113" rx="8" fill="#eff5fb" stroke="#acc3db"/><text x="115" y="240" fill="#285487" font-size="22" font-weight="680">Rank every unmade candidate</text><text x="115" y="269" fill="#19313d" font-size="17" font-weight="400">Activity estimate = purchased FEP prediction when the policy uses it, otherwise SAR.</text><text x="115" y="292" fill="#19313d" font-size="17" font-weight="400">Score = activity estimate + novelty − ½ ln(max(1, remaining steps)) for cost-aware policies.</text><text x="115" y="315" fill="#19313d" font-size="17" font-weight="400">SAR only and FEP with SAR fallback omit the cost penalty.</text><path d="M520 322 V350" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><rect x="99" y="352" width="844" height="113" rx="8" fill="#edf7f4" stroke="#92c5b8"/><text x="115" y="383" fill="#006962" font-size="22" font-weight="680">Commit the batch</text><text x="115" y="412" fill="#19313d" font-size="17" font-weight="400">Keep the two highest-scoring candidates for RENIN, four for ABL1 and S1P1.</text><text x="115" y="435" fill="#19313d" font-size="17" font-weight="400">Within that batch, use the round’s estimates and current inventory prices to choose the next make.</text><text x="115" y="458" fill="#19313d" font-size="17" font-weight="400">Each synthesis reveals its assay and can reduce the price of the remaining batch members.</text><path d="M520 465 V494" fill="none" stroke="#718691" stroke-width="2" marker-end="url(#line)"/><rect x="99" y="496" width="844" height="81" rx="8" fill="#eff5fb" stroke="#acc3db"/><text x="115" y="527" fill="#285487" font-size="22" font-weight="680">Check the assay</text><text x="115" y="556" fill="#19313d" font-size="17" font-weight="400">Stop on a winning assay. When the batch is exhausted, start a new round with the updated evidence.</text></svg>