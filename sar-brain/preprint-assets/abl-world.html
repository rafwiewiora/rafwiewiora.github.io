function replayDefaults(target){
 return {cut:target==='RENIN'?'0.80':'0.60',error:target==='ABL1'?'easy':'hard'};
}
const gameErrorScale={easy:.5,medium:1,hard:2};
const kcalPerLogPotency=0.00198720425864*298.15*Math.LN10;
const gameSigma=(score,difficulty)=>gameErrorScale[difficulty]*(.5+5*(1-score))/2.5;
// A prepared molecular node represents one distinct, paid reaction output.
function campaign(level, sigmaForScore = () => 0, {completeBatch=false}={}) {
  const {order,products,rx,routes,stages}=level;
  const index=new Map(order.map((id,i)=>[id,i]));
  const best=Math.max(...order.map(id=>products[id].p));
  const neighbors=Object.fromEntries(order.map(id=>[id,[]]));
  for(const [a,b,score,z=0] of level.edges){
    neighbors[a].push([b,score,z]);neighbors[b].push([a,score,-z]);
  }
  let stock=new Set(level.stock), forecasts=new Map(), history=[], lastSaving={};
  const made=()=>order.filter(id=>stock.has(id));
  const goal=()=>made().some(id=>products[id].p>=best-1e-8);
  const remaining=id=>routes[id].filter(n=>!stock.has(n));
  const price=id=>remaining(id).reduce((sum,n)=>sum+rx[n].cost,0);
  const spent=()=>Array.from(stock).reduce((sum,n)=>sum+(rx[n]?.cost||0),0);
  const sources=id=>neighbors[id].filter(([r])=>stock.has(r)).sort((a,b)=>b[1]-a[1]||index.get(a[0])-index.get(b[0]));
  function eligibleFep(){
    return order.filter(n=>!stock.has(n)&&!forecasts.has(n)&&sources(n).length);
  }
  function queryAll(){
    const targets=eligibleFep(),batch=history.length;
    if(goal())return [];
    for(const n of targets){
      if(!act('query',n,sources(n)[0][0]))throw Error('Ineligible FEP target');
      history.at(-1).batch=batch;
    }
    return targets;
  }
  function sar(id){
    const row=level.sim[index.get(id)], near=made().map(n=>[row[index.get(n)],n]).sort((a,b)=>b[0]-a[0]||index.get(a[1])-index.get(b[1])).slice(0,5);
    let w=0,s=0; for(const [t,n] of near){const weight=t**4+1e-8;s+=weight*products[n].p;w+=weight;}
    return {p:s/w,novelty:1-near[0][0]};
  }
  function rank(id,mode){
    const {p,novelty}=sar(id);
    return ((mode==='hybrid' && forecasts.has(id))?forecasts.get(id).p:p)+novelty-(mode==='sar'?0:.5*Math.log(Math.max(1,price(id))));
  }
  function act(type,id,parent){
    if((!completeBatch&&goal())||stock.has(id))return false;
    if(type==='query'){
      if(!products[id]||forecasts.has(id))return false;
      const link=sources(id).find(([n])=>n===parent);
      if(!link)return false;
      const [,score,z]=link, sigma=sigmaForScore(score);
      const p=products[id].p + z*sigma/kcalPerLogPotency;
      forecasts.set(id,{p,parent,score,sigma});history.push({type,id,parent});return true;
    }
    if(type==='make'?!products[id]:type==='prepare'?!stages[id]:true)return false;
    const previous=Object.fromEntries(order.filter(n=>!stock.has(n)).map(n=>[n,price(n)]));
    const ops=remaining(id),cost=price(id),prior=new Set(made());
    for(const n of ops){if(rx[n].inputs.some(i=>rx[i]&&!stock.has(i)))throw Error('Unprepared input');stock.add(n);}
    lastSaving=Object.fromEntries(Object.keys(previous).filter(n=>!stock.has(n)&&previous[n]>price(n)).map(n=>[n,previous[n]-price(n)]));
    history.push({type,id,cost,assayed:made().filter(n=>!prior.has(n)),cheaper:Object.keys(lastSaving).length});return true;
  }
  return {eligibleFep,queryAll,made,goal,remaining,price,spent,sources,sar,rank,act,stock,forecasts,history,best,
          savings:()=>lastSaving,name:id=>(products[id]?.name||stages[id]||'Intermediate '+id.slice(2))};
}
function rival(level,mode){
  const sim=campaign(level);
  while(!sim.goal()){
    const pool=level.order.filter(id=>!sim.stock.has(id));
    if(mode==='hybrid')for(const id of pool){const link=sim.sources(id)[0];if(link&&!sim.forecasts.has(id))sim.act('query',id,link[0]);}
    const scores=pool.map(id=>[id,sim.rank(id,mode)]).sort((a,b)=>b[1]-a[1]);
    if(!sim.act('make',scores[0][0]))throw Error('Illegal computer move');
  }
  return {steps:sim.spent(),queries:sim.forecasts.size};
}

const b=JSON.parse(document.getElementById('data').textContent),ref=b.reference,stage=b.stage;
const $=id=>document.getElementById(id),sel=s=>document.querySelector(s),action=s=>sel('[data-action="'+s+'"]');
const nm=p=>10**(9-p),fmt=n=>Number(n.toPrecision(2)).toString();
let game,selected,assays,steps;
function reset(){selected=b.defaultCandidate;assays=0;steps=0;game=campaign(b,s=>$('mode').value==='ideal'?0:gameSigma(s,$('mode').value),{completeBatch:true});$('event').textContent='Select a compound to see its LoMap score and the steps needed to make it.';render();}
function drawing(n,other){
 const d=b.ranks[n],peer=b.ranks[other];
 const tags=Object.keys(d.sites).filter(k=>d.sites[k][0]!==peer.sites[k]?.[0]);
 const underlay='<g fill="#99dfc6" stroke="#99dfc6">'+tags.map(k=>d.sites[k][2]).join('')+'</g>';
 return d.svg.replace('<!-- END OF HEADER -->',underlay);
}
function render(changed=[]){
 const prior=game.forecasts.get(selected);
 const links=game.sources(selected);
 const [parent,score]=links.find(([id])=>id===prior?.parent)||links[0],allowed=score>=+$('cut').value;
 const f=game.forecasts.get(selected),made=game.stock.has(selected),stocked=game.stock.has(stage);
 const sigma=$('mode').value==='ideal'?0:gameSigma(score,$('mode').value);
 $('refMol').innerHTML=drawing(parent,selected);$('candidateMol').innerHTML=drawing(selected,parent);
 $('refName').textContent=b.products[parent].name;$('refValue').textContent=fmt(nm(b.products[parent].p))+' nM measured reference';$('candidate').textContent=b.products[selected].name;
 sel('[data-readout="assay"]').textContent=made?'Measured · '+fmt(nm(b.products[selected].p))+' nM':'Assay hidden';
 const ring={m_307317:'ring N',m_307318:'ring C–F',m_307319:'ring C–CN'};
 $('delta').textContent=parent===ref?b.edits[selected]:ring[parent]+' → '+ring[selected];$('gate').textContent='LoMap '+score.toFixed(3)+' '+(allowed?'≥':'<')+' '+$('cut').value+' · '+(allowed?'✓ allowed':'blocked');
 $('edge').classList.toggle('blocked',!allowed);
 action('query').disabled=!allowed||made||!!f;action('query').textContent=f?'FEP queried ✓':'Query FEP · $1';
 $('mode').disabled=game.forecasts.size>0;$('mode').title=$('mode').disabled?'Reset to try a different error draw scale.':'';
 $('forecast').textContent=f?'Predicted '+fmt(nm(f.p))+' nM':made?'Assay available':allowed?'Prediction available':'No query at this cutoff';
 $('uncertainty').textContent='Model σ = '+sigma.toFixed(2)+' kcal/mol'+(f&&sigma?' · ±1σ: '+fmt(nm(f.p+sigma/kcalPerLogPotency))+'–'+fmt(nm(f.p-sigma/kcalPerLogPotency))+' nM':'');
 const graph=$('interval');graph.style.display=f?'block':'none';
 if(f){
  const measuredP=b.products[selected].p,spread=sigma/kcalPerLogPotency;
  const minP=Math.min(f.p-spread,made?measuredP:f.p)-.25,maxP=Math.max(f.p+spread,made?measuredP:f.p)+.25;
  const x=p=>10+170*(maxP-p)/(maxP-minP),lo=x(f.p+spread),hi=x(f.p-spread),mid=x(f.p);
  graph.innerHTML='<path d="M8 19h174" stroke="#c1ced0"/><path d="M'+lo+' 12v14m0 -7H'+hi+'m0 -7v14" fill="none" stroke="#087968" stroke-width="2"/><circle cx="'+mid+'" cy="19" r="4" fill="white" stroke="#087968" stroke-width="2"/>'+(made?'<circle cx="'+x(measuredP)+'" cy="19" r="3" fill="#192e3b"/>':'')+'<text x="95" y="42" text-anchor="middle" fill="#536873" font-size="11">Potency · nM (log scale)</text>';
  graph.setAttribute('aria-label',$('forecast').textContent+'. '+$('uncertainty').textContent);
 }
 const madeNames=new Set(game.made().map(n=>b.products[n].name)),reach=new Set(),added=[];
 for(const n of game.made())for(const [name,s] of b.links[n])if(s>=+$('cut').value&&!madeNames.has(name))reach.add(name);
 const opening=new Set(b.links[ref].filter(([,s])=>s>=+$('cut').value).map(([name])=>name));
 for(const name of reach)if(!opening.has(name))added.push(name);
 $('references').innerHTML='<b>Measured references</b> · '+[...madeNames].join(' + ')+'<small>'+reach.size+' unassayed candidates reachable in the full ABL1 board'+(added.length?' · Newly reachable: '+added.slice(0,3).join(', ')+(added.length>3?' + '+(added.length-3)+' more':''):'')+'</small>';
 $('stageMol').innerHTML=b.stageDrawing;$('stock').textContent=stocked?'✓ In stock':game.price(stage)+' steps to stock';
 $('platform').classList.toggle('in',stocked);
 for(const n of b.candidates){
  const tile=$('tile-'+n),done=game.stock.has(n),cost=game.price(n);
  tile.setAttribute('aria-pressed',n===selected);tile.querySelector('.square').className='square '+(done?'made':stocked?'cheap':'');
  tile.querySelector('.square').textContent=done?'✓':cost;tile.querySelector('small').textContent=done?fmt(nm(b.products[n].p))+' nM assayed':'remaining '+(cost===1?'step':'steps');
  tile.classList.remove('flash');if(changed.includes(n)){void tile.offsetWidth;tile.classList.add('flash');}
 }
 action('stock').disabled=stocked;action('stock').textContent=stocked?'Intermediate stocked ✓':'Stock Stage 174.1 · $'+game.price(stage);
 action('make').disabled=made;action('make').textContent=made?'Assayed ✓':'Make & assay '+b.products[selected].name+' · $'+game.price(selected);
 sel('[data-readout="cost"]').textContent=steps+' synthesis steps · '+game.forecasts.size+' FEP '+(game.forecasts.size===1?'query':'queries')+' · '+assays+' '+(assays===1?'assay':'assays')+' · $'+(steps+game.forecasts.size)+' spent';
}
$('tiles').innerHTML=b.candidates.map(n=>'<button type="button" id="tile-'+n+'" class="tile"><b>'+b.products[n].name+'</b>'+b.ranks[n].svg+'<span class="square"></span><small></small></button>').join('');
for(const n of b.candidates)$('tile-'+n).onclick=()=>{selected=n;render()};
for(const kind of ['stock','make','query'])action(kind).onclick=()=>{
 const before=b.candidates.map(n=>game.price(n)),id=kind==='stock'?stage:selected;
 const parent=game.sources(selected)[0][0];
 if(!game.act(kind==='stock'?'prepare':kind,id,parent))return;
 if(kind!=='query')steps+=game.history.at(-1).cost;
 if(kind==='make')assays++;
 const changed=b.candidates.filter((n,i)=>game.price(n)<before[i]&&!game.stock.has(n));
 $('event').textContent=kind==='query'?'Prediction saved using '+b.products[parent].name+'. Test the selected compound to use it as a reference.':(kind==='stock'?'Stage 174.1 is ready.':b.products[id].name+' assayed.')+(changed.length?' '+changed.map(n=>b.products[n].name).join(', ')+' now cost one step each.':'');
 render(changed);
};
$('cut').onchange=$('mode').onchange=()=>render();action('reset').onclick=reset;reset();
new ResizeObserver(()=>parent.postMessage({type:'abl-paper-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)},'*')).observe(document.querySelector('main'));
</script></body></html>
